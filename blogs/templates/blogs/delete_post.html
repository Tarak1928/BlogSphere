{% extends 'blogs/base.html' %}{% block title %}Delete post | BlogSphere{% endblock %}{% block content %}<section class="form-page"><div class="form-card"><p class="eyebrow">Please confirm</p><h1>Delete this story?</h1><p>Are you sure you want to permanently delete <strong>{{ post.title }}</strong>? This action cannot be undone.</p><form method="post">{% csrf_token %}<button class="button button-danger" type="submit">Yes, delete post</button> <a class="button button-outline" href="{{ post.get_absolute_url }}">Cancel</a></form></div></section>{% endblock %}
